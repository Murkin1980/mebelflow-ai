<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>MebelFlow — проверка схемы</title><style>
:root{--surface:#f7f4ee;--paper:#fffdfa;--text:#302d29;--muted:#70685f;--brand:#176b5b;--warning:#9a4d08;--line:#d8d0c4;--radius:16px;--shadow:0 16px 42px rgba(63,58,52,.09);font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--text);background:var(--surface)}*{box-sizing:border-box}body{margin:0;min-width:320px}.shell{width:min(1120px,100%);margin:auto;padding:clamp(16px,4vw,40px)}header{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:24px}.eyebrow{margin:0 0 6px;color:var(--brand);font-size:.82rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;font:650 clamp(1.4rem,4vw,2.2rem)/1.15 Georgia,serif}.step{color:var(--muted);font-size:.9rem;white-space:nowrap}.stage{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(12px,3vw,28px)}.scheme{width:100%;aspect-ratio:16/10;min-height:280px;display:grid;place-items:center;overflow:hidden}.scheme svg{display:block;width:100%;height:100%;max-height:560px}.empty{color:var(--muted);text-align:center;max-width:360px}.empty strong{display:block;color:var(--text);font:650 1.2rem Georgia,serif;margin-bottom:8px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.module-button{min-height:44px;border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:#fff;color:var(--text);font:600 .92rem system-ui;cursor:pointer}.module-button:hover{border-color:var(--brand)}.module-button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:white}.module-button:focus-visible{outline:3px solid #f0a95b;outline-offset:3px}.status{min-height:24px;margin:14px 2px 0;color:var(--muted);font-size:.9rem}.note{margin:16px 4px 0;color:var(--muted);font-size:.82rem;line-height:1.45}.warning-note{color:var(--warning)}@media(max-width:600px){.shell{padding:14px}header{align-items:end}.stage{padding:10px}.scheme{aspect-ratio:1/1;min-height:340px}.controls{display:grid;grid-template-columns:1fr 1fr}.module-button{padding-inline:10px}.step{font-size:.78rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><main class="shell"><header><div><p class="eyebrow">Компоновка</p><h1>Ваша прямая кухня</h1></div><span class="step">Шаг 3 из 7</span></header><section class="stage" aria-labelledby="scheme-heading"><h2 id="scheme-heading" hidden>Предварительная схема кухни</h2><div id="scheme" class="scheme"></div><div id="controls" class="controls" aria-label="Выберите модуль"></div><p id="status" class="status" aria-live="polite">Схема сохранена</p></section><p class="note">Предварительная схема служит для первичного согласования. Точные размеры и конструкция подтверждаются мебельщиком после замера.</p></main><script type="module" src="./dist/main.js"></script></body></html>
